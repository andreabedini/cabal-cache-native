name: Test build

on:
  workflow_call:
    inputs:
      ghc-version:
        description: The version of GHC to use
        type: string
      cabal-version:
        description: The version of cabal-install to use
        type: string
      package-id:
        type: string
      index-state:
        type: string
      cache-key-prefix:
        type: string
      expect-restored:
        description: Whether every unit should be restored from the cache
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        run-on:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.run-on }}
    continue-on-error: true

    steps:
      - uses: actions/checkout@v7
        with:
          path: cabal-cache-native

      # dist/ is not committed, so build the action before using it.
      - uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          cache: npm
          cache-dependency-path: cabal-cache-native/package-lock.json

      - name: Build the action
        working-directory: cabal-cache-native
        run: |
          npm ci --ignore-scripts
          npm run build

      - uses: haskell-actions/setup@v2
        id: setup
        with:
          ghc-version: ${{ inputs.ghc-version }}
          cabal-version: ${{ inputs.cabal-version }}
          cabal-update: false

      - run: |
          mkdir test-project
          echo "index-state: ${{ inputs.index-state }}" >> test-project/cabal.project
          echo "extra-packages: ${{ inputs.package-id }}" >> test-project/cabal.project

      - run: cabal update

      - run: cabal build ${{ inputs.package-id }} --dry-run
        working-directory: test-project

      - uses: ./cabal-cache-native
        id: cache
        with:
          project-path: test-project
          cache-key-prefix: ${{ inputs.cache-key-prefix }}

      - name: Check that every unit was restored
        if: inputs.expect-restored
        shell: bash
        working-directory: test-project
        run: |
          echo "restored: ${{ steps.cache.outputs.restored }}, missed: ${{ steps.cache.outputs.missed }}"
          test "${{ steps.cache.outputs.restored }}" -gt 0
          test "${{ steps.cache.outputs.missed }}" -eq 0
          cabal build ${{ inputs.package-id }} --dry-run | tee dry-run.log
          if grep -q "requires build" dry-run.log; then
            echo "::error::cabal still has units to build after restoring the cache"
            exit 1
          fi

      - run: cabal build ${{ inputs.package-id }}
        working-directory: test-project
