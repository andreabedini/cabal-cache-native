name: Release

# main holds only source. A release builds dist/ on a commit that is not on
# main, tags it vX.Y.Z and moves the major tag vX to it, so that
# `uses: andreabedini/cabal-cache-native@vX` (or @vX.Y.Z) finds dist/.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, without the leading v (e.g. 1.2.3)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    env:
      VERSION: ${{ inputs.version }}

    steps:
      - name: Check the version
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The version must look like 1.2.3, got '$VERSION'"
            exit 1
          fi
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"
          echo "MAJOR_TAG=v${VERSION%%.*}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7

      - name: Check that the tag is new
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "::error::$TAG already exists"
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          cache: npm

      - name: Build
        run: |
          npm ci --ignore-scripts
          npx tsc --noEmit
          npm run build

      - name: Commit dist and tag the release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The release commit is only reachable from the tags, never from main.
          git switch --detach
          git add --force dist
          git commit -m "chore(release): $TAG"
          git tag "$TAG"
          git tag --force "$MAJOR_TAG"
          git push origin "refs/tags/$TAG"
          git push --force origin "refs/tags/$MAJOR_TAG"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" --verify-tag --generate-notes --title "$TAG"
