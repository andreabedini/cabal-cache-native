name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  cache-epoch: test-${{ github.run_id }}-${{ github.run_attempt || 0 }}

jobs:
  basic-validation:
    strategy:
      fail-fast: false
      matrix:
        runs-on:
          - ubuntu-latest

    runs-on: ${{ matrix.runs-on }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run prettier
        run: npm run format-check

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Audit packages
        run: npm audit --audit-level=high

  tests:
    needs: basic-validation
    uses: ./.github/workflows/tests.yml
