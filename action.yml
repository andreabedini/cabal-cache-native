name: cabal-cache-native
description: Native, granular cache for Haskell cabal projects
inputs:
  project-path:
    description: Relative path to the cabal project
    default: .
    required: false
  plan-json:
    description: Relative path to cabal's plan.json file
    required: false
    default: dist-newstyle/cache/plan.json
  store-path:
    description: Path to the cabal store. By default it is the one cabal uses, as reported by `cabal path`. If set, it is passed to cabal as `--store-dir` and has to match the store your build uses.
    required: false
  cache-key-prefix:
    description: Extra string to prepended to the cache keys. It can be used to isolate different caches or start from scratch.
    required: false
    default: cabal
  cabal:
    description: Path to cabal (cabal-install 3.12 or later)
    required: false
    default: cabal
  ghc:
    description: Path to ghc, passed to cabal as `--with-compiler`. By default it is the one the project uses.
    required: false
  ghc-pkg:
    description: Path to ghc-pkg. By default it is found next to ghc.
    required: false

outputs:
  restored:
    description: Number of units restored from the cache
  missed:
    description: Number of units not restored from the cache, which will be saved at the end of the job

runs:
  using: node24
  main: ./dist/restore.js
  post: ./dist/save.js
